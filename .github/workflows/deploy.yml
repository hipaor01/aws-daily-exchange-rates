name: Test and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Show OIDC identity claims
        shell: bash
        run: |
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          oidc_token="$(python -c \
            'import json, sys; print(json.load(sys.stdin)["value"])' \
            <<< "$oidc_response")"

          OIDC_TOKEN="$oidc_token" python - <<'PY'
          import base64
          import json
          import os

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in (
              "iss",
              "aud",
              "sub",
              "repository",
              "ref",
              "workflow",
              "job_workflow_ref",
          ):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::065451207233:role/ecb-daily-exchange-rates-github-actions
          aws-region: eu-west-1
          role-session-name: github-actions-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Create deployment plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Apply deployment plan
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan