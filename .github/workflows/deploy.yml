name: Test and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::065451207233:role/ecb-daily-exchange-rates-github-actions
          aws-region: eu-west-1
          role-session-name: github-actions-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Create deployment plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Apply deployment plan
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan